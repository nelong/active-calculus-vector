<meta name="twitter:description" content="Active Calculus - Multivariable supports an active learning approach to a course involving multivariable and vector calculus. Every section of Active Calculus - Multivariable offers preview activities designed around preparing users for new topics; multiple activities in each section that can be used either in- or out-of-classtime; interactive WeBWorK exercises; other exercises and tasks that foster students' practice of skills and deeper investigation of conceptual material; opportunities for students to refine their effective communication of geometric and algebraic perspectives. The text makes frequent use of interactive three-dimensional graphics embedded in the text to help students with visualizing. This text is free and open-source, available in HTML, PDF, and print formats (2nd edition will be available by January 2028). Ancillary materials for instructors are also available.">
