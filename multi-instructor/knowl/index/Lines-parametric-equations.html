<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">The parametric equations of a line.</span></h2>
<div class="para logical">
<div class="para">The <dfn class="terminology">parametric equations</dfn> for a line through the point <span class="process-math">\(P = (x_0, y_0, z_0)\)</span> in the direction of the vector <span class="process-math">\(\vv = \langle a,b,c \rangle\)</span> are</div>
<div class="displaymath process-math">
\begin{align*}
x(t) \amp= x_0 + at \amp y(t) \amp= y_0 + bt \amp z(t) \amp= z_0 + ct 
\end{align*}
</div>
