<div class="para">The <dfn class="terminology">average value</dfn> of a function <span class="process-math">\(f\)</span> over <span class="process-math">\(S\)</span> is given by</div>
<div class="displaymath process-math">
\begin{equation*}
f_{\operatorname{AVG}(S)} = \displaystyle \frac{1}{V(S)}  \iiint_S f(x,y,z) \, dV\text{,}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(V(S)\)</span> is the volume of the solid <span class="process-math">\(S\text{.}\)</span>
</div>
