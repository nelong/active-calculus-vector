<div class="para" id="interactive-quadsurfex3-1-1">An interactable three dimensional plot with five options in a drop down menu. The first option is labeled Surface 1 and plots a curved surface centered along the z-axis in light blue with an ellipse shown on the xy-plane in red, a hyperbola shown in the yz-plane in blue, and a hyperbola the xz-plane shown in green. The second option is labeled Surface 2 and plots a curved surface in light blue centered at the origin that increases parabolically in the z-coordinate along constant values of y. This surface curves down in terms of z-coordinates along constant values of x. Additionally, a pair of intersecting lines is shown on the xy-plane in red, a parabola bending down is shown in the yz-plane in blue, and a parabola pointing up in the xz-plane is shown in green. The third option is labeled Surface 3 and plots a cone centered along the z-axis in light blue with a pair of intersecting lines shown in the yz-plane in blue and another pair of intersecting lines in the xz-plane shown in green. The fourth option is labeled Surface 4 and plots a curved surface in light blue centered at the origin that increases parabolically in the z-coordinate as the x and y coordinates move away from the origin. Additionally, an upward facing parabola is shown in the yz-plane in blue, and a parabola pointing up in the xz-plane is shown in green. The fifth option is labeled Surface 5 and plots a hyperboloid of two sheets in light blue. This plot shows two bowl shaped parts separated along the x-axis with a hyperbola shown on the xy-plane in red and a hyperbola the xz-plane shown in green. The sixth option is labeled Surface 6 and plots an ellipsoid in light blue with an ellipse shown on the xyplane in red, an ellipse shown in the yz-plane in blue, and an ellipse in the xz-plane shown in green.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-quadsurfex3-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
