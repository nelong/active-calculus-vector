<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">12.7.4</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>
</h2>
<div class="para logical">
<div class="para">Using the notation introduced for a triple Riemann sum, the <dfn class="terminology">triple integral of <span class="process-math">\(f\)</span> over <span class="process-math">\(B\)</span></dfn> is</div>
<div class="displaymath process-math">
\begin{equation*}
\iiint_B f(x,y,z) \, dV = \lim_{m,n,\ell \to \infty} \sum_{i=1}^m \sum_{j=1}^n \sum_{k=1}^{\ell} f(P_{ijk}) \, \Delta V\text{.}
\end{equation*}
</div>
