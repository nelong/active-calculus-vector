<div class="para" id="interactive-quadsurfaces-1-1">An interactable three dimensional plot with seven options in a drop down menu. The first option is labeled Ellipsoid and plots a curved surface centered at the origin in light blue with an ellipse shown on the xy-plane in red, an ellipse shown on the yz-plane in blue, and an ellipse shown on the xz-plane shown in green. Other ellipses are parallel to each of the coordinate planes. The second option is labeled Hyperboloid of One Sheet and plots a curved surface in light blue centered along the z-axis. Hyperbolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Ellipses are shown parallel to the xy-plane in red. The third option is labeled Hyperboloid of Two Sheets and plots a curved surface in light blue centered along the z-axis with a gap centered at the origin. Hyperbolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Ellipses are shown parallel to the xy-plane in red. The fourth option is labeled Elliptic Paraboloid and plots a bowl shaped surface that curves toward the positive z-axis. Parabolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Ellipses are shown parallel to the xy-plane in red. The fifth option is labeled Saddle/Hyperbolic Paraboloid and plots a curved surface that forms parabolically in the z-coordinate along constant values of y. This surface curves down in terms of z-coordinates along constant values of x. Parabolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Hyperbolas are shown parallel to the xy-plane in red. The sixth option is labeled Alt Saddle and plots a curved surface that forms parabolically in the z-coordinate along constant values of y. This surface curves down in terms of z-coordinates along constant values of x. Parabolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Hyperbolas are shown parallel to the xy-plane in red. The seventh option is labeled Cone and plots a cone centered along the z-axis. Parabolas are shown parallel to the xz-plane in green and parallel to the yz-plane in blue. Ellipses are shown parallel to the xy-plane in red.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-quadsurfaces-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
